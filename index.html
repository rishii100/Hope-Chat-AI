<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Chat AI</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <button class="chatbot-toggler">
      <span class="material-symbols-rounded">mode_comment</span>
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="chatbot">
      <header>
        <h2>Chat AI</h2>
        <span class="close-btn material-symbols-outlined">close</span>
      </header>
      <ul class="chatbox">
        <li class="chat incoming">
          <span class="material-symbols-outlined">smart_toy</span>
          <p>Hello👋, I Chat AI , I will assist you what disasters occured recently</p>
        </li>
        <br>
        <p>Popular Queries:</p>
        <li class="chat incoming">
        <div class="suggested-option" onclick="setQuery('What is Earthquake?')" ><p class="supporting-text-2">What is Earthquake?</p></div>
      </li>
      <br>
      <li class="chat incoming">
        <div class="supporting-text-wrapper" onclick="setQuery('What types of damage have been reported due to the floods?')"><p class="supporting-text-2">What types of damage have been reported due to the floods?</p></div>
      </li>
           
      </ul>


      <div class="chat-input">
        <textarea id="user-query" placeholder="Enter a message..." spellcheck="false" required></textarea>
        <span id="send-btn" class="material-symbols-rounded">send</span>
      </div>
    </div>

  </body>
</html>
